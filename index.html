<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./style.css" />
        <link rel="stylesheet" href="./scrollbar.css" />
        <link rel="stylesheet" href="./response.css" />
        <link rel="stylesheet" href="./fonts.css" />
        <title>Fotogram</title>
        <script src="./app.js"></script>
    </head>
    <body onload="render()">
        <header>
            <img src="./assets/img/Logo2.png" alt="Fotogram Logo mit Text" />
        </header>
        <main>
            <h1>Your personal photo album</h1>
            <div class="gallery" id="gallery"></div>
            <dialog id="imageDialog">
                <header class="dialog_header">
                    <button
                        onclick="closeDialog()"
                        type="button"
                        class="closeButton"
                    >
                        <img src="./assets/icons/close.svg" alt="" />
                    </button>
                    <div><h2 id="imageTitle">Titel vom Bild</h2></div>
                </header>
                <section class="big_image_wrapper">
                    <figure>
                        <img
                            id="dialogBigImage"
                            src=""
                            alt="Img in full view"
                        />
                    </figure>
                </section>
                <footer class="dialog_footer">
                    <button
                        onclick="previousImg()"
                        class="dialog_arrow_button rotate180"
                    >
                        <img src="./assets/icons/Arrow-Right.svg" alt="" />
                    </button>
                    <aside><p id="currentMaxImage">1/12</p></aside>
                    <button onclick="nextImg()" class="dialog_arrow_button">
                        <img src="./assets/icons/Arrow-Right.svg" alt="" />
                    </button>
                </footer>
            </dialog>
        </main>
        <footer>
            <section class="footer_wrapper">
                <img
                    src="./assets/img/DA-Logo.png"
                    alt="Logo von der Developer Akademie"
                />
                <p>© 2023 Developer Akademie GmbH</p>
            </section>
        </footer>
    </body>
</html>
